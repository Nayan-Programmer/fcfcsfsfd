<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Website</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* QUIZ */

        #quizBox {
            display: none;
            text-align: center;
        }

        #quizQuestion {
            margin: 25px 0;
        }

        .options {
            display: flex;
            gap: 15px;
        }

        .options button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .options button:hover {
            background: #333;
        }

        #quizMessage {
            margin-top: 20px;
            color: #555;
        }

        /* ADMIN */

        #adminBox {
            display: none;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .publish-btn {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .publish-btn:hover {
            background: #333;
        }

        /* RESULTS */

        .results {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #ddd;
        }

        .stats {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .stat-box {
            flex: 1;
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            margin-top: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- =========================
         NORMAL WEBSITE / QUIZ
    ========================== -->

    <div class="box" id="quizBox">

        <h1>Welcome to My Website</h1>

        <p>Your website content goes here.</p>

        <h2 id="quizQuestion">
            Question
        </h2>

        <div class="options">

            <button id="yesButton">
                Yes
            </button>

            <button id="noButton">
                No
            </button>

        </div>

        <div id="quizMessage"></div>

    </div>


    <!-- =========================
         ADMIN PANEL
    ========================== -->

    <div class="box" id="adminBox">

        <h1>Quiz Admin</h1>

        <label>
            Question
        </label>

        <input
            type="text"
            id="questionInput"
            placeholder="Enter your question"
        >


        <label>
            First Option
        </label>

        <input
            type="text"
            id="yesInput"
            value="Yes"
        >


        <label>
            Second Option
        </label>

        <input
            type="text"
            id="noInput"
            value="No"
        >


        <button
            class="publish-btn"
            onclick="publishQuiz()"
        >
            Publish Quiz
        </button>


        <!-- RESULTS -->

        <div class="results">

            <h2>Results</h2>

            <div class="stats">

                <div class="stat-box">

                    <div id="yesLabel">
                        YES
                    </div>

                    <div
                        class="stat-number"
                        id="yesCount"
                    >
                        0
                    </div>

                </div>


                <div class="stat-box">

                    <div id="noLabel">
                        NO
                    </div>

                    <div
                        class="stat-number"
                        id="noCount"
                    >
                        0
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

    /* =================================
       DEFAULT QUIZ
    ================================= */

    let quizData = {

        question: "Question",

        yesText: "Yes",

        noText: "No",

        yesCount: 0,

        noCount: 0

    };


    /* =================================
       CHECK URL
    ================================= */

    function isAdminPage() {

        let path =
            window.location.pathname
                .toLowerCase()
                .replace(/\/+$/, "");

        return path === "/admin";

    }


    /* =================================
       SHOW CORRECT PAGE
    ================================= */

    function showPage() {

        const admin =
            isAdminPage();

        const quizBox =
            document.getElementById("quizBox");

        const adminBox =
            document.getElementById("adminBox");


        if (admin) {

            quizBox.style.display = "none";

            adminBox.style.display = "block";

        } else {

            quizBox.style.display = "block";

            adminBox.style.display = "none";

        }

    }


    /* =================================
       LOAD SAVED QUIZ
    ================================= */

    function loadQuiz() {

        const saved =
            localStorage.getItem("quizData");


        if (saved) {

            try {

                quizData =
                    JSON.parse(saved);

            } catch {

                console.log(
                    "Invalid quiz data"
                );

            }

        }


        document.getElementById(
            "quizQuestion"
        ).textContent =
            quizData.question;


        document.getElementById(
            "yesButton"
        ).textContent =
            quizData.yesText;


        document.getElementById(
            "noButton"
        ).textContent =
            quizData.noText;


        document.getElementById(
            "yesLabel"
        ).textContent =
            quizData.yesText
                .toUpperCase();


        document.getElementById(
            "noLabel"
        ).textContent =
            quizData.noText
                .toUpperCase();


        document.getElementById(
            "yesCount"
        ).textContent =
            quizData.yesCount;


        document.getElementById(
            "noCount"
        ).textContent =
            quizData.noCount;

    }


    /* =================================
       PUBLISH QUIZ
    ================================= */

    function publishQuiz() {

        const question =
            document.getElementById(
                "questionInput"
            ).value.trim();


        const yesText =
            document.getElementById(
                "yesInput"
            ).value.trim();


        const noText =
            document.getElementById(
                "noInput"
            ).value.trim();


        if (!question) {

            alert(
                "Please enter a question."
            );

            return;

        }


        if (!yesText || !noText) {

            alert(
                "Please enter both options."
            );

            return;

        }


        quizData = {

            question: question,

            yesText: yesText,

            noText: noText,

            yesCount: 0,

            noCount: 0

        };


        localStorage.setItem(
            "quizData",
            JSON.stringify(quizData)
        );


        loadQuiz();


        alert(
            "Quiz published!"
        );

    }


    /* =================================
       YES BUTTON
    ================================= */

    document
        .getElementById("yesButton")
        .addEventListener(
            "click",
            function () {

                quizData.yesCount++;


                localStorage.setItem(
                    "quizData",
                    JSON.stringify(quizData)
                );


                document.getElementById(
                    "quizMessage"
                ).textContent =
                    "Response recorded.";

            }
        );


    /* =================================
       NO BUTTON
    ================================= */

    document
        .getElementById("noButton")
        .addEventListener(
            "click",
            function () {

                quizData.noCount++;


                localStorage.setItem(
                    "quizData",
                    JSON.stringify(quizData)
                );


                document.getElementById(
                    "quizMessage"
                ).textContent =
                    "Response recorded.";

            }
        );


    /* =================================
       START
    ================================= */

    showPage();

    loadQuiz();

</script>

</body>
</html>
