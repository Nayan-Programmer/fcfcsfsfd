<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Quiz Website</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        .quiz-box,
        .admin-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1,
        h2 {
            margin-bottom: 20px;
        }

        p {
            margin-bottom: 20px;
            color: #555;
        }

        .quiz-box {
            text-align: center;
        }

        .options {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .options button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            background: #222;
            color: white;
            transition: 0.2s;
        }

        .options button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .admin-box {
            display: none;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .publish-btn {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .publish-btn:hover {
            background: #333;
        }

        .results {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #ddd;
        }

        .stats {
            display: flex;
            gap: 15px;
        }

        .stat-box {
            flex: 1;
            padding: 20px;
            text-align: center;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .stat-number {
            font-size: 30px;
            font-weight: bold;
            margin-top: 8px;
        }

        .message {
            margin-top: 20px;
            text-align: center;
            color: #555;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- =========================
             MAIN QUIZ
        ========================== -->

        <div class="quiz-box" id="quizBox">

            <h1>Welcome to My Website</h1>

            <p>Your website content goes here.</p>

            <h2 id="quizQuestion">
                Question
            </h2>

            <div class="options">

                <button id="yesButton">
                    Yes
                </button>

                <button id="noButton">
                    No
                </button>

            </div>

            <div
                class="message"
                id="quizMessage"
            ></div>

        </div>


        <!-- =========================
             ADMIN PANEL
        ========================== -->

        <div class="admin-box" id="adminBox">

            <h1>Quiz Admin</h1>

            <!-- Question -->

            <label for="questionInput">
                Question
            </label>

            <input
                type="text"
                id="questionInput"
                placeholder="Enter your question"
            >


            <!-- First Option -->

            <label for="yesInput">
                First Option
            </label>

            <input
                type="text"
                id="yesInput"
                value="Yes"
            >


            <!-- Second Option -->

            <label for="noInput">
                Second Option
            </label>

            <input
                type="text"
                id="noInput"
                value="No"
            >


            <!-- Publish -->

            <button
                class="publish-btn"
                onclick="publishQuiz()"
            >
                Publish Quiz
            </button>


            <!-- Results -->

            <div class="results">

                <h2>Results</h2>

                <div class="stats">

                    <div class="stat-box">

                        <div id="yesLabel">
                            YES
                        </div>

                        <div
                            class="stat-number"
                            id="yesCount"
                        >
                            0
                        </div>

                    </div>


                    <div class="stat-box">

                        <div id="noLabel">
                            NO
                        </div>

                        <div
                            class="stat-number"
                            id="noCount"
                        >
                            0
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script>

        /*
        ========================================
        QUIZ DATA
        ========================================
        */

        let quizData = {
            question: "Question",
            yesText: "Yes",
            noText: "No",
            yesCount: 0,
            noCount: 0
        };


        /*
        ========================================
        CHECK PAGE
        ========================================
        */

        const isAdmin =
            window.location.pathname === "/admin";


        /*
        ========================================
        SHOW ADMIN OR QUIZ
        ========================================
        */

        if (isAdmin) {

            document.getElementById("quizBox").style.display = "none";

            document.getElementById("adminBox").style.display = "block";

        } else {

            document.getElementById("quizBox").style.display = "block";

            document.getElementById("adminBox").style.display = "none";

        }


        /*
        ========================================
        LOAD QUIZ
        ========================================
        */

        function loadQuiz() {

            const savedQuiz =
                localStorage.getItem("quizData");

            if (savedQuiz) {

                quizData =
                    JSON.parse(savedQuiz);

            }


            document.getElementById("quizQuestion").textContent =
                quizData.question;

            document.getElementById("yesButton").textContent =
                quizData.yesText;

            document.getElementById("noButton").textContent =
                quizData.noText;


            document.getElementById("yesLabel").textContent =
                quizData.yesText.toUpperCase();

            document.getElementById("noLabel").textContent =
                quizData.noText.toUpperCase();


            document.getElementById("yesCount").textContent =
                quizData.yesCount;

            document.getElementById("noCount").textContent =
                quizData.noCount;

        }


        /*
        ========================================
        PUBLISH QUIZ
        ========================================
        */

        function publishQuiz() {

            const question =
                document.getElementById("questionInput").value.trim();

            const yesText =
                document.getElementById("yesInput").value.trim();

            const noText =
                document.getElementById("noInput").value.trim();


            if (!question) {

                alert("Please enter a question.");

                return;

            }


            if (!yesText || !noText) {

                alert("Please enter both options.");

                return;

            }


            quizData.question = question;

            quizData.yesText = yesText;

            quizData.noText = noText;

            quizData.yesCount = 0;

            quizData.noCount = 0;


            localStorage.setItem(
                "quizData",
                JSON.stringify(quizData)
            );


            alert("Quiz published successfully!");


            loadQuiz();

        }


        /*
        ========================================
        YES BUTTON
        ========================================
        */

        document
            .getElementById("yesButton")
            .addEventListener("click", function () {

                quizData.yesCount++;

                localStorage.setItem(
                    "quizData",
                    JSON.stringify(quizData)
                );


                document.getElementById("quizMessage").textContent =
                    "Your response has been recorded.";

            });


        /*
        ========================================
        NO BUTTON
        ========================================
        */

        document
            .getElementById("noButton")
            .addEventListener("click", function () {

                quizData.noCount++;

                localStorage.setItem(
                    "quizData",
                    JSON.stringify(quizData)
                );


                document.getElementById("quizMessage").textContent =
                    "Your response has been recorded.";

            });


        /*
        ========================================
        INITIALIZE
        ========================================
        */

        loadQuiz();

    </script>

</body>
</html>
